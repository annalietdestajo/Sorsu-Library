<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* GENERAL */
  * { box-sizing: border-box; margin:0; padding:0; font-family: Verdana, Geneva, Tahoma, sans-serif; }
  
  body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#7c0d0d,#3b0000,#7c0d0d); 
  }
  
  /* LOGIN BOX */
  .login-box {
    background:#ffffff; 
    width: 500px;
    padding: 50px 40px;
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    text-align: center;
    transition: transform 0.3s ease;
    color:#333;
  }
  
  .login-box:hover { transform: translateY(-5px); }
  
  /* TITLE */
  .login-box h2 {
    color:#222;
    margin-bottom: 25px;
    font-weight: 700;
  }
  
  /* INPUT CONTAINER */
  .input-group {
    position: relative;
    margin-bottom: 20px;
  }
  
  .input-group i {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: #070303;
    font-size: 16px;
  }
  
  .input-group input {
    width: 100%;
    padding: 14px 14px 14px 38px;
    border-radius: 8px;
    border: 1px solid black;
    font-size: 16px;
    background: #f5f5f5;
    color: #1d1515;
    transition: all 0.3s ease;
  }
  
  .input-group input::placeholder {
    color: #888;
  }
  
  .input-group input:focus {
    border-color:#7a0000;
    background:#fff;
    box-shadow: 0 0 8px rgba(122,0,0,0.2);
    outline: black;
  }
  
  /* BUTTON */
  .login-box button {
    width: 100%;
    padding: 13px;
    background: #7a0000;
    color: white;
    border: black;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.3s ease;
  }
  
  .login-box button:hover {
    background: #a30000;
    transform: translateY(-2px);
  }
  
  /* ERROR MESSAGE */
  #error {
    color: #da0404;
    margin-top: 10px;
    min-height: 20px;
    font-weight: 500;
  }
  
  /* LOGO */
  .login-box img {
    width: 100px;
    height: 100px;
    margin-bottom: 20px;
    border-radius: 50%;
    animation: floatLogo 3s ease-in-out infinite;
  }
  
  @keyframes floatLogo {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
  }
  </style>
</head>
<body>

<div class="login-box">
  <img src="images/logo.png" alt="School Logo">

  <h2>SORSU LIBRARY</h2>

  <div class="input-group">
    <i class="fas fa-user"></i>
    <input id="username" placeholder="Username" autocomplete="off">
  </div>

  <div class="input-group">
    <i class="fas fa-lock"></i>
    <input id="password" type="password" placeholder="Password" autocomplete="off">
  </div>

  <button onclick="login()"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
  <p id="error"></p>
</div>

<script>

  const username = document.getElementById("username");
const password = document.getElementById("password");
const errorMsg = document.getElementById("error");


username.addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === "ArrowDown"){
    e.preventDefault();
    password.focus();
  }
});

password.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    e.preventDefault();
    login();
  }
  if(e.key === "ArrowUp"){
    e.preventDefault();
    username.focus();
  }
});
  // --- LOGIN FUNCTION ---
  async function login(){
    try {
      const res = await fetch("/admin/login", {
        method: "POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          username: username.value,
          password: password.value
        })
      });
  
      const data = await res.json();
  
      if(data.success){
        localStorage.setItem("adminLoggedIn","true");
        window.location.replace("dashboard.html");
      } else {
        document.getElementById("error").innerText="Invalid Admin Login";
      }
  
    } catch(err){
      console.error(err);
      document.getElementById("error").innerText="Server not reachable";
    }
  }
  </script>

</body>
</html>
