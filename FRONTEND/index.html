<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library Student Check-In</title>

<style>
  * { box-sizing:border-box; margin:0; font-family:Verdana, Geneva, Tahoma, sans-serif; }
  
  body{
    background: linear-gradient(135deg,#7c0d0d,#2b0000,#7c0d0d); 
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#333;
  }
  
  .card{
    background:#ffffff;
    padding:60px 50px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
    text-align:center;
    width:520px;
    transition:.3s;
    border:1px solid #ddd;
    color:#333;
  }
  
  .logo{
    width:200px;
    margin-bottom:25px;
    animation:floatLogo 3s ease-in-out infinite;
  }
  
  @keyframes floatLogo{
    0%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-12px) scale(1.06);}
    100%{transform:translateY(0) scale(1);}
  }
  
  h2{ color:#222; margin-bottom:30px; }
  
  input{
    width:100%;
    padding:18px 20px;
    font-size:20px;
    border-radius:10px;
    border:2px solid #ddd;
    margin-bottom:20px;
    text-align:left;
    background:#f7f7f7;
    color:#333;
  }
  
  input::placeholder{ color:#777; }
  
  input:focus{
    border-color:#7a0000;
    background:#fff;
    box-shadow:0 0 8px rgba(122,0,0,0.2);
  }
  
  button{
    width:100%;
    padding:16px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#7a0000;
    color:#fff;
    cursor:pointer;
    transition:.3s;
  }
  
  button:hover{ background:blue; }
  
  .register-btn{
    background:#fd7e0f;
    display:none;
    margin-top:10px;
    color:#fff;
  }
  
  .register-card{ display:none; margin-top:20px; }
  
  .popup {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 16px 24px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
  }
  
  .popup.show { opacity:1; pointer-events:auto; }
  .popup.success { background:#28a745; }
  .popup.error { background:#dc3545; }
</style>
</head>

<body>
<div class="card" id="card">
  <img src="images/logo.png" class="logo">
  <h2>Library Check-In</h2>

  <input type="text" id="studentNumber" placeholder="Enter Student Number">
  <button id="checkInBtn" onclick="checkIn()">CHECK-IN</button>

  <button class="register-btn" id="registerButton" onclick="showRegisterCard()">Register Student</button>

  <div class="register-card" id="registerCard">
    <input id="regNumber" readonly placeholder="Student Number">
    <input id="regLast" placeholder="Last Name">
    <input id="regFirst" placeholder="First Name">
    <input id="regCourse" placeholder="Course">
    <button onclick="registerStudent()">Register & Check-In</button>
  </div>
</div>

<div id="popup" class="popup"></div>

<script>
const API='https://sorsu-library.onrender.com';
const input = document.getElementById('studentNumber');
const checkInBtn = document.getElementById('checkInBtn');
const registerCard = document.getElementById('registerCard');
const registerButton = document.getElementById('registerButton');
const regNumber = document.getElementById('regNumber');
const regLast = document.getElementById('regLast');
const regFirst = document.getElementById('regFirst');
const regCourse = document.getElementById('regCourse');

let studentsList = [];

/* POPUP */
function showPopup(message, type='success', duration=3000){
  const popup = document.getElementById('popup');
  popup.innerText = message;
  popup.className = `popup show ${type}`;
  setTimeout(()=>{ popup.className='popup'; }, duration);
}

/* FETCH STUDENTS */
async function fetchStudents(){
  try{
    const res = await fetch(`${API}/students`);
    studentsList = await res.json();
  }catch(err){
    showPopup("Server error!", "error");
    console.error(err);
  }
}

/* CHECK-IN */
async function checkIn(){
  const sn = input.value.trim();
  if(!sn) return showPopup('Please Enter Student Number','error');

  await fetchStudents();
  const student = studentsList.find(s => s.student_number === sn);

  if(student){
    // Check-in existing student
    const res = await fetch(`${API}/checkin`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ student_number: sn })
    });

    const result = await res.json();

    // Dispatch event for admin dashboard
    const visitData = {
      student_number: sn,
      full_name: `${student.last_name}, ${student.first_name} ${student.middle_name || ""}`,
      course: student.course || "",
      date_time: new Date().toLocaleString() // use server timestamp if available
    };
    window.dispatchEvent(new CustomEvent('newCheckin', { detail: visitData }));

    showPopup(`Welcome ${student.first_name}`, 'success');

    registerCard.style.display = 'none';
    registerButton.style.display = 'none';
    input.style.display = 'block';
    checkInBtn.style.display = 'block';
  } else {
    // Show registration form
    registerCard.style.display = 'block';
    registerButton.style.display = 'none';
    input.style.display = 'none';
    checkInBtn.style.display = 'none';
    regNumber.value = sn;
    regLast.focus();
  }

  input.value = '';
}

/* REGISTER STUDENT */
async function registerStudent(){
  const sn = regNumber.value.trim();
  const last = regLast.value.trim();
  const first = regFirst.value.trim();
  const course = regCourse.value.trim();

  if(!last || !first || !course) return showPopup('Fill all fields','error');

  await fetch(`${API}/student`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      student_number: sn,
      last_name: last,
      first_name: first,
      middle_name: "",
      course: course
    })
  });

  // Auto check-in
  const res = await fetch(`${API}/checkin`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ student_number: sn })
  });
  const result = await res.json();

  // Dispatch event for admin dashboard
  const visitData = {
    student_number: sn,
    full_name: `${last}, ${first}`,
    course: course,
    date_time: new Date().toLocaleString() // use server timestamp if available
  };
  window.dispatchEvent(new CustomEvent('newCheckin', { detail: visitData }));

  showPopup(`Registered & Welcome ${first}`, 'success');

  registerCard.style.display = 'none';
  input.style.display = 'block';
  checkInBtn.style.display = 'block';

  regLast.value = '';
  regFirst.value = '';
  regCourse.value = '';
  input.focus();
}
/* ENTER KEY SUPPORT */
input.addEventListener("keypress", e => { if(e.key==="Enter") checkIn(); });

window.onload = () => { input.focus(); };

</script>
</body>
</html>
